# Netlify deployment configuration for Eventide (static Vite build).
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in:
#   Netlify dashboard → Site settings → Environment variables

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serve index.html for any path so direct visits / refreshes resolve to the
# hash-routed app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
